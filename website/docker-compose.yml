# Docker Compose 配置 — 欢乐家印尼子公司官网
# 用法：docker compose up -d --build
# 查看日志：docker compose logs -f
# 停止：docker compose down
# 重启：docker compose restart

services:
  web:
    build: .
    container_name: idhlj-website
    restart: always
    ports:
      - "80:80"
    # 如需挂载自定义配置或证书，取消下方注释
    # volumes:
    #   - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    #   - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/en/"]
      interval: 30s
      timeout: 10s
      retries: 3
