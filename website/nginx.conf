# 简化版 Nginx 配置 — 欢乐家印尼子公司官网
# 文件结构：out/en/about/index.html, out/id/about/index.html, ...

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # 1. 根路径 → /en/
    location = / {
        return 302 /en/;
    }

    # 2. 把 /en、/id 加尾斜杠（精确匹配，不带斜杠才匹配）
    location = /en { return 301 /en/; }
    location = /id { return 301 /id/; }

    # 3. 拒绝访问 .txt（Next.js 生成的 SSR fallback）
    location ~ \.txt$ { return 404; }

    # 4. 静态资源长缓存
    location ~* \.(pdf|jpg|jpeg|png|gif|svg|ico|webp|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 5. 禁止访问隐藏文件
    location ~ /\. { deny all; }

    # 6. 其余所有请求：找文件 → 找目录 → 找 index.html → 404
    location / {
        try_files $uri $uri/index.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
